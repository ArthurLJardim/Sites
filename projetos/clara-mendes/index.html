<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"><!-- projeto demonstrativo com marca fictícia: fora dos resultados de busca -->
  <title>Carregando...</title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tema.css">
</head>
<body>
  <header class="topo">
    <div class="container topo__linha">
      <a class="marca" href="#inicio" data-nome></a>
      <nav class="menu" aria-label="Principal">
        <a href="#servicos">Serviços</a>
        <a href="#sobre">Sobre</a>
        <a href="#depoimentos">Depoimentos</a>
        <a href="#duvidas">Dúvidas</a>
        <a href="#contato">Contato</a>
      </nav>
      <a class="botao botao--pequeno" data-whatsapp target="_blank" rel="noopener">Agendar</a>
    </div>
  </header>

  <main id="inicio">
    <section class="hero">
      <div class="container hero__grade">
        <div>
          <p class="etiqueta" data-etiqueta></p>
          <h1 data-hero-titulo></h1>
          <p class="hero__sub" data-hero-sub></p>
          <a class="botao" data-whatsapp data-hero-botao target="_blank" rel="noopener"></a>
          <p class="hero__fone">ou ligue: <strong data-telefone></strong></p>
        </div>
        <ul class="destaques" data-destaques></ul>
      </div>
    </section>

    <section class="secao" id="servicos">
      <div class="container">
        <h2>Serviços</h2>
        <div class="cartoes" data-servicos></div>
      </div>
    </section>

    <section class="secao secao--suave" id="sobre">
      <div class="container sobre">
        <div>
          <h2 data-sobre-titulo></h2>
          <p data-sobre-texto></p>
        </div>
        <ul class="lista-check" data-diferenciais></ul>
      </div>
    </section>

    <section class="secao" id="depoimentos">
      <div class="container">
        <h2>O que dizem nossos pacientes</h2>
        <div class="cartoes cartoes--3" data-depoimentos></div>
      </div>
    </section>

    <section class="secao secao--suave" id="duvidas">
      <div class="container container--estreito">
        <h2>Dúvidas frequentes</h2>
        <div data-faq></div>
      </div>
    </section>

    <section class="secao" id="contato">
      <div class="container contato">
        <div>
          <h2>Onde estamos</h2>
          <p data-endereco></p>
          <dl class="horarios" data-horarios></dl>
          <a class="botao" data-whatsapp target="_blank" rel="noopener">Chamar no WhatsApp</a>
        </div>
        <iframe class="mapa" data-mapa title="Mapa com a localização" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <div class="container rodape__linha">
      <span data-rodape></span>
      <a data-instagram target="_blank" rel="noopener">Instagram</a>
    </div>
  </footer>

  <a class="flutuante" data-whatsapp target="_blank" rel="noopener" aria-label="Conversar no WhatsApp">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M16 3C8.8 3 3 8.8 3 16c0 2.3.6 4.5 1.7 6.4L3 29l6.8-1.8c1.9 1 4 1.6 6.2 1.6 7.2 0 13-5.8 13-13S23.2 3 16 3zm0 23.600c-2 0-3.900-.5-5.600-1.500l-.4-.2-4 1 1.100-3.900-.3-.4C5.700 19.900 5.200 18 5.200 16 5.200 10 10 5.200 16 5.200S26.800 10 26.800 16 22 26.600 16 26.600zm5.900-8c-.3-.2-1.900-.9-2.200-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.200-.2.2-.4.2-.7.100-.3-.2-1.400-.5-2.600-1.600-1-.9-1.600-1.900-1.800-2.300-.2-.3 0-.5.100-.7l.5-.6c.2-.2.2-.3.3-.5.100-.2.100-.4 0-.6-.100-.2-.7-1.800-1-2.400-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.100-.9.4-.3.3-1.200 1.200-1.200 2.800s1.200 3.300 1.400 3.500c.2.2 2.400 3.600 5.700 5 .8.3 1.400.6 1.900.7.8.3 1.500.2 2.100.100.6-.100 1.900-.8 2.200-1.500.3-.8.3-1.400.2-1.500-.100-.2-.3-.200-.6-.400z"/></svg>
  </a>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
